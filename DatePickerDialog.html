<!DOCTYPE html>
<html>
  <head><base target="_top"></head>
  <body>
    <label for="reportDate">Pilih Tanggal Laporan:</label><br>
    <input type="date" id="reportDate"><br><br>
    <button onclick="submitDate()">Lanjut</button>

    <script>
      function submitDate() {
        const date = document.getElementById("reportDate").value;
        if (!date) {
          alert("Pilih tanggal terlebih dahulu.");
          return;
        }

        google.script.run.withSuccessHandler(response => {
          if (response.status === "exists") {
            alert("Sheet sudah ada untuk tanggal itu.");
          } else if (response.status === "error") {
            alert(response.message);
          } else {
            localStorage.setItem("activityOptions", JSON.stringify(response.activities));
            google.script.host.close();
            google.script.run.showActivitySelector();
          }
        }).createSheetAndPickActivities(date);
      }
    </script>
  </body>
</html>
